<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<canvas id="canvas" width="128" height="128"></canvas>
<script src="../../node_modules/butterchurn/lib/butterchurn.min.js"></script>
<script>
window.__visualizer = null;

window.__init = function () {
  const canvas = document.getElementById('canvas');
  const Butterchurn = window.butterchurn.default || window.butterchurn;
  window.__visualizer = Butterchurn.createVisualizer(null, canvas, {
    width: 128,
    height: 128,
    pixelRatio: 1,
    textureRatio: 1,
  });
  return true;
};

// Generate synthetic "music-like" time-domain audio data for one frame.
// t is the frame index, used to vary frequency/amplitude over time.
function genWave(t, seed) {
  const arr = new Uint8Array(1024);
  const f1 = 0.05 + 0.02 * Math.sin(t * 0.07 + seed);
  const f2 = 0.15 + 0.05 * Math.cos(t * 0.05 + seed * 1.3);
  const amp = 40 + 30 * Math.abs(Math.sin(t * 0.1 + seed * 0.7));
  for (let i = 0; i < arr.length; i++) {
    const v = Math.sin(i * f1 + t * 0.3) * amp * 0.6
            + Math.sin(i * f2 + t * 0.2) * amp * 0.4
            + (Math.random() - 0.5) * 10;
    arr[i] = Math.max(0, Math.min(255, Math.round(128 + v)));
  }
  return arr;
}

window.__analyzePreset = function (preset, frames, seed) {
  const vis = window.__visualizer;
  try {
    vis.loadPreset(preset, 0);
  } catch (e) {
    return { error: 'loadPreset: ' + e.message };
  }

  const canvas = document.getElementById('canvas');
  const gl = canvas.getContext('webgl2');
  const w = canvas.width, h = canvas.height;
  const buf = new Uint8Array(w * h * 4);

  let snapshots = [];
  const snapAt = new Set([Math.floor(frames * 0.5), frames - 1]);

  try {
    for (let i = 0; i < frames; i++) {
      const time = genWave(i, seed);
      const timeL = genWave(i, seed + 0.37);
      const timeR = genWave(i, seed + 0.81);
      vis.render({ audioLevels: { timeByteArray: time, timeByteArrayL: timeL, timeByteArrayR: timeR } });

      if (snapAt.has(i)) {
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
        // compute mean and stddev of luminance
        let sum = 0, sumSq = 0;
        const n = w * h;
        for (let p = 0; p < n; p++) {
          const r = buf[p * 4], g = buf[p * 4 + 1], b = buf[p * 4 + 2];
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          sum += lum;
          sumSq += lum * lum;
        }
        const mean = sum / n;
        const variance = sumSq / n - mean * mean;
        snapshots.push({ frame: i, mean, std: Math.sqrt(Math.max(0, variance)), pixels: Uint8Array.from(buf) });
      }
    }
  } catch (e) {
    return { error: 'render: ' + e.message };
  }

  // motion = mean abs diff between the two snapshots
  let motion = 0;
  if (snapshots.length === 2) {
    const a = snapshots[0].pixels, b = snapshots[1].pixels;
    let diffSum = 0;
    for (let p = 0; p < a.length; p += 4) {
      diffSum += Math.abs(a[p] - b[p]) + Math.abs(a[p+1] - b[p+1]) + Math.abs(a[p+2] - b[p+2]);
    }
    motion = diffSum / (a.length / 4 * 3);
  }

  return {
    mean1: snapshots[0] ? snapshots[0].mean : null,
    std1: snapshots[0] ? snapshots[0].std : null,
    mean2: snapshots[1] ? snapshots[1].mean : null,
    std2: snapshots[1] ? snapshots[1].std : null,
    motion,
  };
};
</script>
</body>
</html>
