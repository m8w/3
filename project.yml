name: MilkDropMac
options:
  bundleIdPrefix: com.milkdropmac
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    METAL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE

targets:
  MilkDropMac:
    type: application
    platform: macOS
    sources:
      - path: MilkDropMac
        excludes:
          - "XCODE_SETUP.md"
          - "Resources/Presets/**"
        createIntermediateGroups: true
      - path: MilkDropMac/Resources/Presets
        buildPhase: resources
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_NAME: MilkDropMac
        PRODUCT_BUNDLE_IDENTIFIER: com.milkdropmac.app
        INFOPLIST_FILE: MilkDropMac/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: MilkDropMac/Syphon/MilkDropMac-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: MilkDropMac/MilkDropMac.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.app-sandbox: true
