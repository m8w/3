<!DOCTYPE html>
<!--
  mixer_host.html — 3-source Butterchurn mixer with add/subtract compositing.

  Three independent Butterchurn visualizers render to three offscreen canvases.
  A WebGL2 compositor blends them:  out = clamp( Σ signᵢ · weightᵢ · screenᵢ ).
  Each screen has an independent sign (+ add / − subtract) and weight. Weights
  are audio-reactive (bass→1, mid→2, treb→3) and can be nudged live by key.

  Swift bridge (unchanged from the single-screen host):
    window._addPresets(obj)   — PresetLoader feeds the shared preset pool
    window._updateQ([32])     — AudioEngine feeds 32 microtonal bins
    window._keyCommand(cmd)    — WebViewContainer forwards key commands

  Keys:  1/2/3 select screen · n/p next/prev on selected · b cut · s toggle sign
         [ / ] weight −/+ · m auto-mix · 0 reset mix · space pause · h hud
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100vw; height:100vh; background:#000; overflow:hidden; }
  /* Source canvases render offscreen — never shown directly. */
  .src { position:absolute; left:-10000px; top:0; }
  #out { display:block; width:100vw; height:100vh; }

  /* Interactive control bar — clickable; auto-fades when idle. */
  #bar {
    position:fixed; top:0; left:0; right:0; padding:10px 14px; z-index:9999;
    display:flex; gap:12px; align-items:stretch;
    background:linear-gradient(rgba(0,0,0,0.74), rgba(0,0,0,0.12));
    font:12px/1.4 'SF Mono','Menlo',monospace; color:#fff; text-shadow:0 1px 4px #000;
    transition:opacity .45s ease; opacity:1;
  }
  #bar.idle   { opacity:0; }
  #bar.hidden { display:none; }
  .panel { flex:1; min-width:0; padding:8px 10px; border-radius:8px;
           background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
           display:flex; flex-direction:column; gap:6px; }
  .panel.sel { border-color:rgba(120,200,255,0.95); background:rgba(120,200,255,0.14); }
  .panel .hd { display:flex; justify-content:space-between; align-items:center; font-weight:700; }
  .nav { display:flex; align-items:center; gap:6px; }
  .nav .nm { flex:1; min-width:0; color:rgba(255,255,255,0.82); font-size:11px;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button.mx { cursor:pointer; pointer-events:auto; border:none; border-radius:5px; padding:3px 8px;
              font:700 12px 'SF Mono',monospace; color:#fff; background:rgba(255,255,255,0.16); }
  button.mx:hover { background:rgba(255,255,255,0.30); }
  button.sgn.add { background:rgba(70,210,120,0.88); color:#012; }
  button.sgn.sub { background:rgba(235,90,90,0.92); }
  .wrow { display:flex; align-items:center; gap:8px; }
  input.wt { flex:1; pointer-events:auto; accent-color:#7CC4FF; }
  .wv { width:34px; text-align:right; color:rgba(255,255,255,0.82); }
  .meter { height:5px; background:rgba(255,255,255,0.15); border-radius:3px; overflow:hidden; }
  .meter .mfill { height:100%; width:0%; background:linear-gradient(90deg,#7CC4FF,#7CFFA0); transition:width .08s linear; }
  .master { display:flex; flex-direction:column; gap:6px; justify-content:center; min-width:130px; }
  .master button { pointer-events:auto; }
  #ginfo { position:fixed; bottom:10px; left:16px; right:16px; font:11px/1.4 'SF Mono',monospace;
           color:rgba(255,255,255,0.6); text-shadow:0 1px 4px #000; pointer-events:none; z-index:9999; }
</style>
</head>
<body>
<canvas id="s0" class="src"></canvas>
<canvas id="s1" class="src"></canvas>
<canvas id="s2" class="src"></canvas>
<canvas id="out"></canvas>

<div id="bar">
  <div class="panel" data-s="0">
    <div class="hd"><span>SCREEN 1</span><button class="mx sgn add" data-act="sign">＋ ADD</button></div>
    <div class="nav"><button class="mx" data-act="prev">◀</button><span class="nm">…</span><button class="mx" data-act="next">▶</button></div>
    <div class="wrow"><input class="wt" type="range" min="0" max="1.6" step="0.05" data-act="weight"><span class="wv">0.85</span></div>
    <div class="meter"><div class="mfill"></div></div>
  </div>
  <div class="panel" data-s="1">
    <div class="hd"><span>SCREEN 2</span><button class="mx sgn add" data-act="sign">＋ ADD</button></div>
    <div class="nav"><button class="mx" data-act="prev">◀</button><span class="nm">…</span><button class="mx" data-act="next">▶</button></div>
    <div class="wrow"><input class="wt" type="range" min="0" max="1.6" step="0.05" data-act="weight"><span class="wv">0.70</span></div>
    <div class="meter"><div class="mfill"></div></div>
  </div>
  <div class="panel" data-s="2">
    <div class="hd"><span>SCREEN 3</span><button class="mx sgn add" data-act="sign">＋ ADD</button></div>
    <div class="nav"><button class="mx" data-act="prev">◀</button><span class="nm">…</span><button class="mx" data-act="next">▶</button></div>
    <div class="wrow"><input class="wt" type="range" min="0" max="1.6" step="0.05" data-act="weight"><span class="wv">0.70</span></div>
    <div class="meter"><div class="mfill"></div></div>
  </div>
  <div class="master">
    <button class="mx" id="autoBtn" data-act="auto">AUTO-MIX: ON</button>
    <button class="mx" id="reactBtn" data-act="react">REACT: LOW/MID/HIGH</button>
    <button class="mx" id="blendBtn" data-act="blend">BLEND: ADD</button>
    <button class="mx" id="mutateBtn" data-act="mutate">MUTATE: OFF</button>
    <button class="mx" data-act="reset">RESET MIX</button>
    <button class="mx" data-act="hide">GRAPHICS ONLY ⤢</button>
  </div>
</div>
<div id="ginfo">＋/− polarity · weight slider · ◀▶ preset · C blend · R react (freq⇄stereo) · G mutate · 1/2/3 then X reject · H hide bar · F fill screen (not ⌃⌘F)</div>

<!-- Preset queue shim (PresetLoader may inject before the module runs) -->
<script>
window._presetQueue = [];
window._addPresets    = function(p){ window._presetQueue.push({ screen: -1, presets: p }); };
window._addPresetsFor = function(s, p){ window._presetQueue.push({ screen: s, presets: p }); };
</script>

<script type="module">
const $ = id => document.getElementById(id);
function log(m){ try{ window.webkit.messageHandlers.log.postMessage('[JS] '+m); }catch(_){} }

let butterchurn = window.butterchurn;
if (butterchurn && !butterchurn.createVisualizer && butterchurn.default) butterchurn = butterchurn.default;
if (!butterchurn || !butterchurn.createVisualizer) {
  $('ginfo').textContent = 'butterchurn not loaded — check Swift console';
  log('ERROR: window.butterchurn missing: ' + JSON.stringify(butterchurn && Object.keys(butterchurn)));
  throw new Error('butterchurn unavailable');
}

// ── render sizes & rate ───────────────────────────────────────────────────────
// High quality by default. Tunable via window.__MIXER — if you ever need GPU
// headroom for screen capture (smoother captured audio), lower CFG.fps to 30,
// which keeps the resolution sharp but halves the render load.
const CFG     = (window.__MIXER || {});
const SRC_W   = CFG.srcW   || 1280;    // per-screen butterchurn resolution (720p, sharp)
const SRC_H   = CFG.srcH   || 720;
const OUT_W   = CFG.outW   || 1920;    // composite / broadcast resolution
const OUT_H   = CFG.outH   || 1080;
const RENDER_FPS = CFG.fps || 60;      // render rate cap

// ── microtonal EEL injection (same approach as the single-screen host) ────────
const PF_INIT =
  'low=0;mlo=0;mhi=0;high=0;centroid=0.5;flux_lo=0;flux_hi=0;flux_mid=0;' +
  'low_att=0;high_att=0;mid_att=0;spin_acc=0;dq_lo=0;dq_hi=0;dq_mid=0;dq_air=0;';
const PER_FRAME =
  'low=(q1+q2+q3+q4+q5+q6+q7+q8)*0.125;mlo=(q9+q10+q11+q12+q13+q14+q15+q16)*0.125;' +
  'mhi=(q17+q18+q19+q20+q21+q22+q23+q24)*0.125;high=(q25+q26+q27+q28+q29+q30+q31+q32)*0.125;' +
  'low_att=low_att*0.75+low*0.25;mid_att=mid_att*0.78+mlo*0.22+mhi*0.10;high_att=high_att*0.65+high*0.35;' +
  '_denom=low+mlo+mhi+high+0.001;centroid=(low*0.125+mlo*0.375+mhi*0.625+high*0.875)/_denom;' +
  'flux_lo=abs(q1-q2)+abs(q3-q4)+abs(q5-q6)+abs(q7-q8);flux_hi=abs(q25-q26)+abs(q27-q28)+abs(q29-q30)+abs(q31-q32);' +
  'flux_mid=abs(q12-q13)+abs(q14-q15)+abs(q20-q21)+abs(q22-q23);dq_lo=q8-q9;dq_mid=q16-q17;dq_hi=q20-q21;dq_air=q28-q29;' +
  'spin_acc=spin_acc*0.92+dq_lo*0.08;decay=0.965-low_att*0.018;zoom=1.012+low_att*0.055-high_att*0.025;' +
  'rot=0.005+spin_acc*0.4+centroid*0.015*sin(time*0.7);warp=1.00+q1*0.20+q32*0.15+flux_hi*1.20;' +
  'dx=dq_lo*0.012+dq_air*0.005*sin(time*1.1);dy=dq_hi*0.012+dq_mid*0.005*cos(time*0.9);' +
  'wave_r=0.4+bass*0.6;wave_g=0.3+mid*0.7;wave_b=0.5+treb*0.5;wave_x=0.5+dq_lo*0.15;wave_y=0.5+dq_hi*0.15;' +
  'wave_scale=0.7+high_att*1.3;wave_a=0.5+mid_att*0.5;';
const PER_PIXEL =
  'warp=warp+q1*0.10*sin(rad*2.5+time*0.4);warp=warp+(q16+q17)*0.06*cos(ang*3.0+time*0.9);' +
  'warp=warp+q32*0.08*sin(x*14.0+y*14.0+time*2.5)*rad*rad;zoom=zoom+low_att*rad*0.06;' +
  'rot=rot+flux_hi*0.08*sin(rad*4.0);dx=dx+dq_lo*sin(ang)*0.010+q1*sin(rad*2.0+time*0.3)*0.020;' +
  'dy=dy+dq_hi*cos(ang)*0.010+q2*cos(rad*2.0+time*0.3)*0.020;dx=dx+(q8-q9)*0.010;dy=dy+(q20-q21)*0.010;' +
  'dx=dx+q32*sin(x*18.0+time*3.2)*0.006;dy=dy+q31*cos(y*18.0+time*3.2)*0.006;';

function patchPreset(base) {
  if (typeof base.warp === 'string' && base.warp.includes('shader_body')) return base;
  const pfEEL = base.per_frame_eqs_eel || base.perFrameEQs || '';
  const ppEEL = base.per_pixel_eqs_eel || base.perPixelEQs || '';
  if (pfEEL.trim()) {
    const pfKey   = 'perFrameEQs' in base ? 'perFrameEQs' : 'per_frame_eqs_eel';
    const ppKey   = 'perPixelEQs' in base ? 'perPixelEQs' : 'per_pixel_eqs_eel';
    const initKey = 'initEQs'     in base ? 'initEQs'     : 'init_eqs_eel';
    return { ...base, [initKey]:(base[initKey]||'')+PF_INIT+midiEELinit(),
             [pfKey]:pfEEL+PER_FRAME+midiEELframe(), [ppKey]:ppEEL+PER_PIXEL };
  }
  const { init_eqs_str, frame_eqs_str, pixel_eqs_str, ...rest } = base;
  return { ...rest, init_eqs_eel: PF_INIT+midiEELinit(),
           per_frame_eqs_eel: PER_FRAME+midiEELframe(), per_pixel_eqs_eel: PER_PIXEL };
}

// ── preset mutation: perturb params + equation constants for fresh looks ──────
// Only standalone float literals are jittered (numbers with a decimal point,
// never those embedded in identifiers like a.q29), so syntax can't break.
let mutateAmt = 0, mutateLevel = 0;
const MUTATE_AMTS = [0, 0.12, 0.25], MUTATE_NAMES = ['OFF','SUBTLE','WILD'];
const MUT_SKIP = new Set(['rating']);
function jitNum(v, a){ return v * (1 + (Math.random()*2 - 1) * a); }
function jitFloats(code, a){
  return code.replace(/(?<![\w.])(\d*\.\d+|\d+\.\d*)(?![\w.])/g, m => {
    const v = parseFloat(m) * (1 + (Math.random()*2 - 1) * a);
    return Number.isFinite(v) ? v.toFixed(5) : m;
  });
}
function mutatePreset(src, a){
  const p = JSON.parse(JSON.stringify(src));
  const bv = p.baseVals;
  if (bv) {
    for (const k in bv){
      const v = bv[k];
      if (typeof v === 'number' && !Number.isInteger(v) && !MUT_SKIP.has(k)){
        const nv = jitNum(v, a);
        bv[k] = Number.isFinite(nv) ? nv : v;     // never introduce NaN/∞
      }
    }
    if (typeof bv.decay    === 'number') bv.decay    = Math.min(1,   Math.max(0,   bv.decay));
    if (typeof bv.gammaadj === 'number') bv.gammaadj = Math.min(8,   Math.max(0.1, bv.gammaadj));
    if (typeof bv.zoom     === 'number') bv.zoom     = Math.min(8,   Math.max(0.1, bv.zoom));
  }
  for (const k of ['init_eqs_str','frame_eqs_str','pixel_eqs_str'])
    if (typeof p[k] === 'string') p[k] = jitFloats(p[k], a * 0.6);   // gentler on equations
  return p;
}
// Mutation is a MOMENTARY, on-demand effect — it never persists. The auto-cycle
// and manual navigation always load the clean, unmutated preset, so every preset
// change resets values back to normal. Pressing G re-renders the CURRENT presets
// with a jittered variation; it clears itself the next time each screen cycles.
function mutateCurrent(){
  for (let s = 0; s < 3; s++){
    const idx = screen[s].idx;
    if (idx < 0 || idx >= namesByScreen[s].length) continue;
    const base = allPresets[namesByScreen[s][idx]];
    try { viz[s].loadPreset(patchPreset(mutateAmt > 0 ? mutatePreset(base, mutateAmt) : base), 1.5); }
    catch(e) { try { viz[s].loadPreset(patchPreset(base), 0); } catch(_){} }   // bad jitter → clean
  }
}

// ── audio: shared 32-bin → 1024-bin frequency + waveform buffers ──────────────
const FBINS = 1024;
// Per-screen frequency data so each screen can react to its own channel in
// stereo mode (left / center / right). In mono all three get the same data.
const freqData = [ new Uint8Array(FBINS), new Uint8Array(FBINS), new Uint8Array(FBINS) ];
const timeData = new Uint8Array(FBINS); timeData.fill(128);
const lastQ = new Float32Array(32);
let stereoReactive = false;   // set true once stereo data arrives
// Smoothed band energies per screen (0..~1). `all` = overall channel energy.
const band = [ {bass:0,mid:0,treb:0,all:0}, {bass:0,mid:0,treb:0,all:0}, {bass:0,mid:0,treb:0,all:0} ];

// Reactivity mapping: 'bands' = low/mid/high per screen (from one mono/center
// signal); 'stereo' = left/center/right per screen. Toggle live with R.
let reactMode = 'bands';

// Process one 32-bin channel into screen s: fills freqData[s] + band[s].
function feedChannel(q, s) {
  const fd = freqData[s];
  for (let b = 0; b < FBINS; b++) {
    const frac = (b / FBINS) * 31, lo = frac | 0, hi = Math.min(lo + 1, 31), t = frac - lo;
    fd[b] = ((q[lo] * (1 - t) + q[hi] * t) * 220) | 0;
  }
  let lo = 0, md = 0, hi = 0;
  for (let i = 0;  i < 8;  i++) lo += q[i];
  for (let i = 8;  i < 24; i++) md += q[i];
  for (let i = 24; i < 32; i++) hi += q[i];
  const bd = band[s];
  bd.bass = bd.bass * 0.8 + (lo / 8)  * 0.2;
  bd.mid  = bd.mid  * 0.8 + (md / 16) * 0.2;
  bd.treb = bd.treb * 0.8 + (hi / 8)  * 0.2;
  bd.all  = bd.all  * 0.8 + ((lo + md + hi) / 32) * 0.2;
}

// Mono capture: every screen reacts to the same signal (low/mid/high weighting).
function updateAudio(q) {
  for (let i = 0; i < 32; i++) lastQ[i] = q[i];
  feedChannel(q, 0); feedChannel(q, 1); feedChannel(q, 2);
}

// Stereo capture: honour the live react mode.
function updateStereo(l, r) {
  const c = new Array(32);
  for (let i = 0; i < 32; i++) { c[i] = (l[i] + r[i]) * 0.5; lastQ[i] = c[i]; }
  if (reactMode === 'stereo') { feedChannel(l, 0); feedChannel(c, 1); feedChannel(r, 2); }
  else                        { feedChannel(c, 0); feedChannel(c, 1); feedChannel(c, 2); }
}

// ── three independent visualizers ─────────────────────────────────────────────
const audioCtx = new AudioContext();
const srcCanvas = [$('s0'), $('s1'), $('s2')];
const viz = srcCanvas.map(c => { c.width = SRC_W; c.height = SRC_H;
  return butterchurn.createVisualizer(audioCtx, c, { width: SRC_W, height: SRC_H, pixelRatio: 1 }); });

const allPresets = {};
// Each screen has its OWN preset pool. In per-screen mode (three folders) the
// pools are distinct, so the screens can never show the same preset. In shared
// mode all three pools hold the same names (populated by _addPresets), which is
// the original single-pool behaviour. loadOn/stepOn always work on pool s.
const namesByScreen = [[], [], []];
const rejected = new Set();   // names culled live via the reject key (X)
const screen = [
  { idx:-1, sign:+1, weight:0.85, band:'bass' },
  { idx:-1, sign:+1, weight:0.70, band:'mid'  },
  { idx:-1, sign:+1, weight:0.70, band:'treb' },
];
let selected = 0, autoMix = true, paused = false, hudVisible = true;

function currentName(s){ const p = namesByScreen[s]; return (screen[s].idx >= 0 && screen[s].idx < p.length) ? p[screen[s].idx] : null; }

function loadOn(s, blend) {
  const pool = namesByScreen[s];
  if (!pool.length) return false;
  const n = pool.length;
  const start = (Math.random() * n) | 0;   // random jump across this screen's whole pool
  // Pass 0 avoids presets already on another screen (by name, so it works across
  // separate pools too); pass 1 relaxes that so a tiny pool still loads something.
  const busy = new Set([currentName(0), currentName(1), currentName(2)]);
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < n; i++) {
      const idx = (start + i) % n;
      const nm = pool[idx];
      if (rejected.has(nm)) continue;
      if (pass === 0 && busy.has(nm)) continue;
      try { viz[s].loadPreset(patchPreset(allPresets[nm]), blend); screen[s].idx = idx; return true; }
      catch(e) { /* try next */ }
    }
  }
  return false;
}
function stepOn(s, dir, blend) {
  const pool = namesByScreen[s];
  if (!pool.length) return;
  const n = pool.length;
  let start = screen[s].idx < 0 ? 0 : (screen[s].idx + dir + n) % n;
  for (let i = 0; i < n; i++) {
    const idx = (start + dir*i + n*1000) % n;
    const nm = pool[idx];
    if (rejected.has(nm)) continue;
    try { viz[s].loadPreset(patchPreset(allPresets[nm]), blend); screen[s].idx = idx; refreshHUD(); return; }
    catch(e) {}
  }
}

// Reject the preset currently on the selected screen: drop it from the live
// rotation AND tell Swift to move its file out of the presets folder for good.
function rejectCurrent() {
  const s = selected, idx = screen[s].idx;
  if (idx < 0 || idx >= namesByScreen[s].length) return;
  const name = namesByScreen[s][idx];
  rejected.add(name);
  try { window.webkit.messageHandlers.log.postMessage('REJECT\t' + name); } catch(_) {}
  log('rejected: ' + name);
  stepOn(s, +1, 0);   // jump this screen to the next (skips rejected)
  showBar();
}

// Independent auto-cycling per screen with a RANDOM interval each time, so the
// three screens never fall into a fixed, predictable rhythm: ~6 seconds ± up to
// 3s → each change lands somewhere in 3–9s. The random jitter also keeps the
// three screens naturally out of phase.
const CYCLE_MS   = 6000;   // base seconds between preset changes
const CYCLE_JIT  = 3000;   // ± random spread
const CYCLE_BLEND = 1.2;   // shorter blend so a preset reads before the next one
const cycleTimers = [];
function scheduleCycle(s) {
  const ms = CYCLE_MS + (Math.random() * 2 - 1) * CYCLE_JIT;
  cycleTimers[s] = setTimeout(() => {
    if (!paused) { loadOn(s, CYCLE_BLEND); refreshHUD(); }
    scheduleCycle(s);
  }, ms);
}
function startCycles() {
  cycleTimers.forEach(t => clearTimeout(t)); cycleTimers.length = 0;
  for (let s = 0; s < 3; s++) scheduleCycle(s);
}

// ── WebGL2 compositor ─────────────────────────────────────────────────────────
const out = $('out'); out.width = OUT_W; out.height = OUT_H;
const gl = out.getContext('webgl2', { alpha:false, antialias:false, preserveDrawingBuffer:false });

const VS = `#version 300 es
in vec2 p; out vec2 uv;
void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;
const FS = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D t0, t1, t2;
uniform vec3 sw;            // signed weights (signᵢ·weightᵢ)
uniform int mode;           // blend mode 0..9
uniform float uRot;         // whole-composite rotation (radians) — MIDI pitch-bend + song osc
uniform float uScale;       // whole-composite zoom — MIDI cutoff arc breathing
uniform float uGamma;       // output gamma — MIDI hardness arc
const vec3 LUM = vec3(0.299, 0.587, 0.114);
// Fold op for modes 2..7 (a = accumulated, b = next layer).
vec3 fold(vec3 a, vec3 b){
  if (mode == 2) return max(a, b);                                   // Lighten
  if (mode == 3) return a / max(vec3(1.0) - b, 0.004);               // Color Dodge
  if (mode == 4) return vec3(1.0) - (vec3(1.0) - a) / max(b, 0.004); // Color Burn
  if (mode == 5) return mix(2.0*a*b, vec3(1.0) - 2.0*(vec3(1.0)-a)*(vec3(1.0)-b), step(vec3(0.5), b)); // Hard Light
  if (mode == 6) return abs(a - b);                                  // Difference
  if (mode == 7) return a + b - 2.0*a*b;                             // Exclusion
  return a + b;
}
void main(){
  // Whole-composite transform driven by the SN2 song oscillators: rotate + zoom
  // about the centre. uScale is biased ≥1 so the frame stays covered when rotated.
  vec2 cen = uv - 0.5;
  float sn = sin(uRot), cs = cos(uRot);
  cen = mat2(cs, -sn, sn, cs) * cen / max(uScale, 0.05);
  vec2 uvr = cen + 0.5;
  vec3 c0 = texture(t0, uvr).rgb, c1 = texture(t1, uvr).rgb, c2 = texture(t2, uvr).rgb;
  float w0 = sw.x, w1 = sw.y, w2 = sw.z;
  vec3 r;
  if (mode == 0) {                       // Add
    r = c0*w0 + c1*w1 + c2*w2;
  } else if (mode == 1) {                // Subtract (screen 1 base, others subtract)
    r = c0*abs(w0) - c1*abs(w1) - c2*abs(w2);
  } else if (mode == 8) {                // Alpha-over: 3 over 2 over 1
    r = c0 * clamp(abs(w0), 0.0, 1.0);
    r = mix(r, c1, clamp(abs(w1), 0.0, 1.0));
    r = mix(r, c2, clamp(abs(w2), 0.0, 1.0));
  } else if (mode == 9) {                // RGB split: each screen → one channel
    r = vec3(dot(c0,LUM)*abs(w0), dot(c1,LUM)*abs(w1), dot(c2,LUM)*abs(w2));
  } else {                               // fold modes 2..7: weight = layer opacity,
    vec3 s0 = (w0 < 0.0 ? vec3(1.0)-c0 : c0);   // blend runs on full-range colors so
    vec3 s1 = (w1 < 0.0 ? vec3(1.0)-c1 : c1);   // non-linear modes (burn/dodge/hard
    vec3 s2 = (w2 < 0.0 ? vec3(1.0)-c2 : c2);   // light) don't crush to black
    r = s0 * clamp(abs(w0), 0.0, 1.0);
    r = mix(r, fold(r, s1), clamp(abs(w1), 0.0, 1.0));
    r = mix(r, fold(r, s2), clamp(abs(w2), 0.0, 1.0));
  }
  o = vec4(pow(clamp(r, 0.0, 1.0), vec3(uGamma)), 1.0);
}`;
function compile(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);   // canvas top-left → GL bottom-left
const tex = [0,1,2].map(i => {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
});
gl.uniform1i(gl.getUniformLocation(prog, 't0'), 0);
gl.uniform1i(gl.getUniformLocation(prog, 't1'), 1);
gl.uniform1i(gl.getUniformLocation(prog, 't2'), 2);
const swLoc = gl.getUniformLocation(prog, 'sw');
const modeLoc = gl.getUniformLocation(prog, 'mode');
const rotLoc = gl.getUniformLocation(prog, 'uRot');
const scaleLoc = gl.getUniformLocation(prog, 'uScale');
const gammaLoc = gl.getUniformLocation(prog, 'uGamma');
const BLEND_NAMES = ['ADD','SUBTRACT','LIGHTEN','COLOR DODGE','COLOR BURN','HARD LIGHT','DIFFERENCE','EXCLUSION','ALPHA-OVER','RGB SPLIT'];
let blendMode = 0;
gl.viewport(0, 0, OUT_W, OUT_H);

// ── MIDI reactivity + ch-16-anchored oscillators ──────────────────────────────
// The SN2 rig sends no MIDI clock; its ch-16 Program Change is the sync anchor
// (t≡0) and every sound-design modulator is a slow sine whose period is a
// multiple of the 17:17 song unit (1037s). We reconstruct that same sine family
// here from the anchor so the visuals breathe on the identical 17:17 arcs, and
// fold the live CC arcs (channel 0, the reference phase) in on top.
const SONG_UNIT = 1037;                 // 17:17 in seconds — matches sn2_chaos8_runs.py
const TAU = Math.PI * 2;
// period multiples + param phases, copied verbatim from the sn2 script
const OSC_DEF = {
  cutoff:   { mult: 2.25, phase: Math.PI * 0.8 },
  hardness: { mult: 1.75, phase: Math.PI * 0.4 },
  resonance:{ mult: 2.75, phase: Math.PI * 1.2 },
  sync:     { mult: 3.25, phase: Math.PI * 1.6 },
  pitch:    { mult: 1.25, phase: 0.0 },
};
function osc01(name){ const d = OSC_DEF[name]; return (Math.sin(TAU * songTime / (SONG_UNIT * d.mult) + d.phase) + 1) * 0.5; }

let midi = null, _midiHits = 0, midiPulse = 0;
let anchorIndex = -1, lastProgram = -999, songTime = 0;
const _t0 = performance.now();
// Smoothed live CC arcs (0..1) — the actual synth values, slewed to 60fps.
const M = { on:false, cut:0.5, reso:0.3, hard:0.4, sync:0.5, mod:0, bend:0 };

window._updateMIDI = m => {
  const first = !midi; midi = m;
  M.on = !!m.connected;
  if (typeof m.hits === 'number') { if (m.hits > _midiHits) midiPulse = Math.min(1.5, midiPulse + 0.5); _midiHits = m.hits; }
  // A ch-16 Program Change = a new Performance = a 17:17 downbeat. Count anchors
  // so the reconstructed song clock stays locked to the pulse, drift-free.
  if (typeof m.program === 'number' && m.program >= 0 && m.program !== lastProgram) {
    lastProgram = m.program; anchorIndex++; onSongDownbeat();
  }
  if (typeof m.beat === 'number' && m.beat >= 0 && anchorIndex >= 0)
    songTime = anchorIndex * SONG_UNIT + m.beat;
  if (first && m.connected) log('MIDI connected — locking visuals to the SN2 17:17 arcs');
};

// New Performance landed: turn the whole mix over in step + a structural change.
function onSongDownbeat(){
  midiPulse = Math.min(1.6, midiPulse + 0.9);
  if (anchorIndex <= 0) return;                       // skip the startup anchor
  for (let s = 0; s < 3; s++) loadOn(s, 3.0);         // loadOn no-ops on an empty pool
  // Blend mode is NEVER changed automatically — it stays exactly where you set it
  // (C key / HUD) until you change it again.
  refreshHUD();
}
// Before any anchor arrives, free-run the clock so the oscillators still move.
function tickSongClock(){ if (anchorIndex < 0) songTime = (performance.now() - _t0) / 1000; }
// Slew the smoothed live arcs toward the latest MIDI CCs each frame.
function updateMidiSmooth(){
  if (!midi || !midi.connected) return;
  const k = 0.05;
  M.cut  += ((midi.cutoff ?? 0.5) - M.cut ) * k;
  M.reso += ((midi.reso   ?? 0.3) - M.reso) * k;
  M.hard += ((midi.hard   ?? 0.4) - M.hard) * k;
  M.sync += ((midi.sync   ?? 0.5) - M.sync) * k;
  M.mod  += ((midi.mod    ?? 0.0) - M.mod ) * k;
  M.bend += ((midi.bend   ?? 0.0) - M.bend) * k;
}
// Extra energy the MIDI stream contributes: note pulses + mod wheel + note count.
function midiEnergy(){
  if (!midi || !midi.connected) return 0;
  return Math.min(1.5, midiPulse + (M.mod || 0) * 0.4 + Math.min(0.5, (midi.notes || 0) * 0.08));
}
// Composite-level drivers (smooth, 60fps). Live arcs give the true synced motion;
// a touch of reconstructed pitch osc adds organic life.
function midiRot(){   return M.on ? (M.bend * 0.14 + (osc01('pitch') - 0.5) * 0.08) : 0; }
function midiScale(){ return M.on ? (1.02 + (M.cut - 0.5) * 0.10) : 1.0; }
function midiGamma(){ return M.on ? Math.max(0.5, Math.min(1.8, 1.0 + (M.hard - 0.4) * 0.5)) : 1.0; }

// Baked EEL so the milkdrop equations themselves read the MIDI arcs. Refreshed on
// every preset (re)load (~30s), which re-syncs the slow 17:17 arcs each time.
function midiEELinit(){
  if (!M.on) return '';
  return 'm_cut=' + M.cut.toFixed(4) + ';m_reso=' + M.reso.toFixed(4) +
         ';m_hard=' + M.hard.toFixed(4) + ';m_bend=' + M.bend.toFixed(4) + ';';
}
function midiEELframe(){
  if (!M.on) return '';
  const wC = (TAU / (SONG_UNIT * OSC_DEF.cutoff.mult)).toFixed(8);   // rad/s, the 17:17 cadence
  return 'zoom=zoom+(m_cut-0.5)*0.05;warp=warp+m_reso*0.28;' +
         'rot=rot+m_bend*0.015+sin(' + wC + '*time)*0.008;decay=decay-(m_hard-0.4)*0.010;';
}

function bandEnergy(s){ return reactMode === 'stereo' ? band[s].all : band[s][screen[s].band]; }
function effectiveWeight(s){
  const base = screen[s].weight;
  if (!autoMix) return base;
  let e = Math.min(1.4, (bandEnergy(s) + midiEnergy() * 0.6) * 1.6);
  // The resonance/sync arcs gently emphasise the mix across the song (screen 2
  // swells on the sync crest, the flanks fall — a slow, locked breathing).
  if (M.on) e *= 1 + (M.reso - 0.3) * 0.25 + (M.sync - 0.5) * 0.20 * (s === 1 ? 1 : -0.5);
  return Math.max(0, Math.min(1.6, base * (0.45 + 0.95 * e)));
}

// ── render loop: render all three, upload, composite — all in one rAF turn ────
let renderErr = [0, 0, 0];   // consecutive render errors per screen
function composeOnce(){
  midiPulse *= 0.90;   // note pulses decay each frame
  tickSongClock();     // advance the 17:17 song clock + smooth the live MIDI arcs
  updateMidiSmooth();
  for (let s = 0; s < 3; s++) {
    try {
      viz[s].render({ frequencyData: freqData[s], timeByteData: timeData });
      renderErr[s] = 0;
    } catch (e) {
      // A bad preset/mutation threw — recover this screen without freezing the
      // whole loop. Reload its current preset UNMUTATED; if it keeps failing,
      // move on to a different preset.
      if (++renderErr[s] <= 2 && currentName(s)) {
        try { viz[s].loadPreset(patchPreset(allPresets[currentName(s)]), 0); } catch(_) {}
      } else {
        renderErr[s] = 0; stepOn(s, +1, 0);
      }
    }
  }
  for (let s = 0; s < 3; s++) {
    gl.activeTexture(gl.TEXTURE0 + s);
    gl.bindTexture(gl.TEXTURE_2D, tex[s]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas[s]);
  }
  gl.uniform3f(swLoc,
    screen[0].sign * effectiveWeight(0),
    screen[1].sign * effectiveWeight(1),
    screen[2].sign * effectiveWeight(2));
  gl.uniform1i(modeLoc, blendMode);
  gl.uniform1f(rotLoc, midiRot());
  gl.uniform1f(scaleLoc, midiScale());
  gl.uniform1f(gammaLoc, midiGamma());
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

const FRAME_MS = 1000 / RENDER_FPS;
let _lastFrame = -1e9;
function frame(ts){
  requestAnimationFrame(frame);
  if (paused) return;
  if (ts - _lastFrame < FRAME_MS - 1.5) return;   // cap render rate → frees GPU for capture
  _lastFrame = ts;
  composeOnce();
  if (hudVisible) tickHUD();
}

// Validation/debug hook: synchronously compose one frame and read it back.
window.__readComposite = function(){
  composeOnce();
  const px = new Uint8Array(OUT_W * OUT_H * 4);
  gl.readPixels(0, 0, OUT_W, OUT_H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let sum = 0, nz = 0; const step = 64;        // sample every 16th pixel (×4)
  for (let i = 0; i < px.length; i += step) { const v = px[i]+px[i+1]+px[i+2]; sum += v; if (v > 12) nz++; }
  const n = px.length / step;
  return { meanRGBsum: +(sum/n).toFixed(1), nonBlackFrac: +(nz/n).toFixed(3) };
};

// ── HUD: interactive control bar ───────────────────────────────────────────────
const bar = $('bar');
const panels = [0,1,2].map(s => {
  const el = bar.querySelector('.panel[data-s="'+s+'"]');
  return { box: el, sgn: el.querySelector('.sgn'), nm: el.querySelector('.nm'),
           wt: el.querySelector('.wt'), wv: el.querySelector('.wv'), mfill: el.querySelector('.mfill') };
});
const autoBtn = $('autoBtn');
const blendBtn = $('blendBtn');
const reactBtn = $('reactBtn');
const mutateBtn = $('mutateBtn');

function refreshHUD(){
  for (let s = 0; s < 3; s++){
    const p = panels[s], add = screen[s].sign > 0;
    p.box.classList.toggle('sel', s === selected);
    p.sgn.textContent = add ? '＋ ADD' : '− SUB';
    p.sgn.className = 'mx sgn ' + (add ? 'add' : 'sub');
    p.nm.textContent = currentName(s) || '…';
    p.wt.value = screen[s].weight;
    p.wv.textContent = screen[s].weight.toFixed(2);
  }
  autoBtn.textContent = 'AUTO-MIX: ' + (autoMix ? 'ON' : 'OFF');
  blendBtn.textContent = 'BLEND: ' + BLEND_NAMES[blendMode];
  reactBtn.textContent = 'REACT: ' + (reactMode === 'stereo' ? 'L/MID/R' : 'LOW/MID/HIGH');
  mutateBtn.textContent = 'MUTATE: ' + MUTATE_NAMES[mutateLevel];
}
function tickHUD(){
  for (let s = 0; s < 3; s++)
    panels[s].mfill.style.width = Math.min(100, effectiveWeight(s) / 1.6 * 100).toFixed(0) + '%';
}

// Clean toggle: HUD pinned-and-showing, or graphics only. No auto-fade.
function setHud(on){
  hudVisible = on;
  bar.classList.toggle('hidden', !on);
  $('ginfo').style.display = on ? '' : 'none';
}
function showBar(){ /* HUD stays pinned while visible — nothing to reveal */ }

// Click handling (event delegation) — works regardless of the Swift key path.
bar.addEventListener('click', e => {
  const panel = e.target.closest('.panel');
  const btn   = e.target.closest('button.mx');
  if (panel) selected = +panel.dataset.s;
  showBar();
  if (!btn) { refreshHUD(); return; }
  const s = panel ? +panel.dataset.s : selected;
  switch (btn.dataset.act) {
    case 'sign':  screen[s].sign *= -1; refreshHUD(); break;
    case 'prev':  stepOn(s, -1, 2.7); break;     // stepOn refreshes the HUD
    case 'next':  stepOn(s, +1, 2.7); break;
    case 'auto':  autoMix = !autoMix; refreshHUD(); break;
    case 'reset': resetMix(); break;
    case 'hide':  setHud(false); break;   // → graphics only (H brings it back)
  }
});
bar.addEventListener('input', e => {
  const inp = e.target.closest('input.wt'); if (!inp) return;
  const s = +e.target.closest('.panel').dataset.s;
  selected = s; screen[s].weight = parseFloat(inp.value);
  panels[s].wv.textContent = screen[s].weight.toFixed(2);
  refreshHUD(); showBar();
});

// ── Swift bridges ─────────────────────────────────────────────────────────────
window._updateQ = q => { stereoReactive = false; updateAudio(q); };
window._updateStereo = (l, r) => { stereoReactive = true; updateStereo(l, r); };

let cyclesStarted = false;
function addToPool(s, incoming){
  const keys = Object.keys(incoming);
  if (!keys.length) return;
  Object.assign(allPresets, incoming);
  namesByScreen[s].push(...keys);
}
// Once any pool has content, load an initial preset onto each ready screen and
// (once) start the auto-cycles.
function maybeStart(){
  for (let s = 0; s < 3; s++)
    if (screen[s].idx < 0 && namesByScreen[s].length) loadOn(s, 0);
  if (!cyclesStarted && namesByScreen.some(p => p.length)) { startCycles(); cyclesStarted = true; }
  refreshHUD();
}
// Shared pool: every screen draws from the same set (original behaviour).
window._addPresets = function(incoming){
  for (let s = 0; s < 3; s++) addToPool(s, incoming);
  log('presets (shared): ' + namesByScreen[0].length);
  maybeStart();
};
// Per-screen pool: screen s draws ONLY from its own folder (no cross-repetition).
window._addPresetsFor = function(s, incoming){
  s = Math.max(0, Math.min(2, s | 0));
  addToPool(s, incoming);
  log('presets screen ' + (s + 1) + ': ' + namesByScreen[s].length);
  maybeStart();
};
(window._presetQueue || []).forEach(item => {
  if (item && item.presets) {
    if (item.screen >= 0) window._addPresetsFor(item.screen, item.presets);
    else window._addPresets(item.presets);
  }
});
window._presetQueue = null;

function resetMix(){
  screen[0].sign = screen[1].sign = screen[2].sign = +1;
  screen[0].weight = 0.85; screen[1].weight = 0.70; screen[2].weight = 0.70;
  autoMix = true; refreshHUD();
}

window._keyCommand = function(cmd){
  switch(cmd){
    case '1': case '2': case '3': selected = (+cmd) - 1; refreshHUD(); break;
    case 'next': stepOn(selected, +1, 2.7); break;
    case 'prev': stepOn(selected, -1, 2.7); break;
    case 'cut':  stepOn(selected, +1, 0);   break;
    case 'sign': screen[selected].sign *= -1; refreshHUD(); break;
    case 'wdn':  screen[selected].weight = Math.max(0, screen[selected].weight - 0.1); refreshHUD(); break;
    case 'wup':  screen[selected].weight = Math.min(1.6, screen[selected].weight + 0.1); refreshHUD(); break;
    case 'auto': autoMix = !autoMix; refreshHUD(); break;
    case 'react': reactMode = reactMode === 'bands' ? 'stereo' : 'bands'; refreshHUD(); showBar(); break; // R
    case 'mutate': // G — momentary: cycle strength and mutate the CURRENT look (clears on next cycle)
      mutateLevel = (mutateLevel + 1) % MUTATE_AMTS.length; mutateAmt = MUTATE_AMTS[mutateLevel];
      mutateCurrent();
      refreshHUD(); showBar(); break;
    case 'blend':     blendMode = (blendMode + 1) % BLEND_NAMES.length; refreshHUD(); showBar(); break; // C
    case 'blendPrev': blendMode = (blendMode - 1 + BLEND_NAMES.length) % BLEND_NAMES.length; refreshHUD(); showBar(); break;
    case 'reset':resetMix(); break;
    case 'reject': rejectCurrent(); break;      // X = cull the selected screen's preset for good
    case 'pause':paused = !paused; break;
    case 'hud':  setHud(!hudVisible); return;   // H = HUD ⇄ graphics-only
  }
};

// Local keyboard fallback (when the WebView itself has focus).
document.addEventListener('keydown', e => {
  const map = { '1':'1','2':'2','3':'3','n':'next','p':'prev','b':'cut','s':'sign',
                '[':'wdn',']':'wup','m':'auto','0':'reset','x':'reject','c':'blend','C':'blendPrev',
                'r':'react','g':'mutate',' ':'pause','h':'hud','ArrowRight':'next','ArrowLeft':'prev' };
  const c = map[e.key]; if (c){ e.preventDefault(); window._keyCommand(c); }
});

// Mouse fallback so you can always get out of graphics-only mode, even if the
// keyboard path isn't reaching the page: double-click the visuals toggles the HUD.
$('out').addEventListener('dblclick', () => setHud(!hudVisible));

window._viz = viz;
refreshHUD();
requestAnimationFrame(frame);   // start the render loop after everything is defined
log('mixer module ready');
</script>
</body>
</html>
